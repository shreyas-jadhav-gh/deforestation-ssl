[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forestwatch"
version = "1.1.0"
description = "A Python pipeline for mapping deforestation from Sentinel-2 images: from Earth Engine to trained models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shreyas Jadhav" }, { name = "Pratham Reure" }]
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
train = ["torch", "segmentation-models-pytorch==0.5.0", "matplotlib"]
data = ["earthengine-api", "pyproj"]
test = ["pytest"]

[project.scripts]
forestwatch = "forestwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forestwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
